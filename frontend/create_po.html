<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Purchase Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">PO Management</span>
    <a href="index.html" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
</nav>

<div class="container mt-4" style="max-width: 800px;">
    <h5 class="mb-3">Create New Purchase Order</h5>
    <div id="alert" class="alert d-none"></div>

    <div class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">Vendor</label>
            <select id="vendor-select" class="form-select">
                <option value="">Loading vendors...</option>
            </select>
        </div>

        <hr>
        <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>Order Items</strong>
            <button class="btn btn-outline-primary btn-sm" onclick="addRow()">+ Add Product</button>
        </div>

        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Product</th>
                    <th></th>
                    <th style="width:120px">Quantity</th>
                    <th style="width:130px">Unit Price</th>
                    <th style="width:50px"></th>
                </tr>
            </thead>
            <tbody id="items-tbody"></tbody>
        </table>

        <div class="text-end mb-3">
            <strong>Subtotal: </strong><span id="subtotal">$0.00</span><br>
            <strong>Tax (5%): </strong><span id="tax">$0.00</span><br>
            <strong>Total: </strong><span id="total">$0.00</span>
        </div>

        <button class="btn btn-success w-100" onclick="submitOrder()">Submit Order</button>
    </div>
</div>

<script>
    let products = [];

    async function loadVendors() {
        const res = await fetch('http://localhost:8000/vendors/');
        const vendors = await res.json();
        const select = document.getElementById('vendor-select');
        select.innerHTML = vendors.map(v =>
            `<option value="${v.id}">${v.name}</option>`
        ).join('');
    }

    async function loadProducts() {
        const res = await fetch('http://localhost:8000/products/');
        products = await res.json();
    }

    function addRow() {
        const tbody = document.getElementById('items-tbody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>
                <select class="form-select product-select" onchange="updateRowPrice(this)">
                    ${products.map(p => `<option value="${p.id}" data-price="${p.unit_price}">${p.name}</option>`).join('')}
                </select>
            </td>
            <td><input type="number" class="form-control qty-input" value="1" min="1" oninput="recalculate()"></td>
            <td><input type="number" class="form-control price-input" value="${products[0]?.unit_price || 0}" step="0.01" oninput="recalculate()"></td>
            <td><button class="btn btn-sm btn-danger" onclick="removeRow(this)">✕</button></td>
        `;
        tbody.appendChild(row);
        recalculate();
    }

    function updateRowPrice(select) {
        const price = select.options[select.selectedIndex].dataset.price;
        const row = select.closest('tr');
        row.querySelector('.price-input').value = price;
        recalculate();
    }

    function removeRow(btn) {
        btn.closest('tr').remove();
        recalculate();
    }

    function recalculate() {
        const rows = document.querySelectorAll('#items-tbody tr');
        let subtotal = 0;
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            subtotal += qty * price;
        });
        const tax = subtotal * 0.05;
        const total = subtotal + tax;
        document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
        document.getElementById('tax').textContent = '$' + tax.toFixed(2);
        document.getElementById('total').textContent = '$' + total.toFixed(2);
    }

    function addRow() {
        const tbody = document.getElementById('items-tbody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>
                <select class="form-select product-select" onchange="updateRowPrice(this)">
                    ${products.map(p => `<option value="${p.id}" data-price="${p.unit_price}">${p.name}</option>`).join('')}
                </select>
                <small class="text-muted ai-description"></small>
            </td>
            <td>
                <button class="btn btn-outline-secondary btn-sm mt-1" onclick="getDescription(this)" title="Auto-generate description">✨</button>
            </td>
            <td><input type="number" class="form-control qty-input" value="1" min="1" oninput="recalculate()"></td>
            <td><input type="number" class="form-control price-input" value="${products[0]?.unit_price || 0}" step="0.01" oninput="recalculate()"></td>
            <td><button class="btn btn-sm btn-danger" onclick="removeRow(this)">✕</button></td>
        `;
        tbody.appendChild(row);
        recalculate();
    }

    async function submitOrder() {
        const token = localStorage.getItem('token');
        const vendor_id = parseInt(document.getElementById('vendor-select').value);
        const rows = document.querySelectorAll('#items-tbody tr');

        if (rows.length === 0) {
            showAlert('Add at least one product', 'danger');
            return;
        }

        const items = Array.from(rows).map(row => ({
            product_id: parseInt(row.querySelector('.product-select').value),
            quantity: parseInt(row.querySelector('.qty-input').value),
            unit_price: parseFloat(row.querySelector('.price-input').value)
        }));

        try {
            const res = await fetch('http://localhost:8000/orders/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ vendor_id, items })
            });

            if (!res.ok) throw new Error('Failed to create order');

            showAlert('Order created successfully!', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function getDescription(btn) {
        const row = btn.closest('tr');
        const select = row.querySelector('.product-select');
        const productName = select.options[select.selectedIndex].text;
        const descEl = row.querySelector('.ai-description');

        btn.disabled = true;
        btn.textContent = '...';
        descEl.textContent = 'Generating...';

        try {
            const res = await fetch('http://localhost:8000/ai/describe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_name: productName })
            });
            const data = await res.json();
            descEl.textContent = data.description;
        } catch (err) {
            descEl.textContent = 'Failed to generate description.';
        } finally {
            btn.disabled = false;
            btn.textContent = '✨';
        }
    }

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.textContent = msg;
        el.className = `alert alert-${type}`;
    }

    if (!localStorage.getItem('token')) {
        window.location.href = 'login.html';
    } else {
        loadVendors();
        loadProducts().then(() => addRow());
    }
</script>
</body>
</html>
