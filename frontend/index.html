<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">PO Management</span>
    <div>
        <a href="create_po.html" class="btn btn-success btn-sm me-2">+ New Order</a>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-4">
    <h5 class="mb-3">All Purchase Orders</h5>
    <table class="table table-bordered table-hover bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Reference No</th>
                <th>Vendor ID</th>
                <th>Total Amount</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="orders-table">
            <tr><td colspan="4" class="text-center">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const statusColors = {
        DRAFT: 'secondary',
        SUBMITTED: 'primary',
        APPROVED: 'success',
        REJECTED: 'danger'
    };

    async function loadOrders() {
        const res = await fetch('http://localhost:8000/orders/');
        const orders = await res.json();
        const tbody = document.getElementById('orders-table');

        if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center">No orders yet</td></tr>';
            return;
        }

        tbody.innerHTML = orders.map(o => `
            <tr>
                <td>${o.reference_no}</td>
                <td>${o.vendor_id}</td>
                <td>$${parseFloat(o.total_amount).toFixed(2)}</td>
                <td><span class="badge bg-${statusColors[o.status] || 'secondary'}">${o.status}</span></td>
            </tr>
        `).join('');
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
    }

    if (!localStorage.getItem('token')) {
        window.location.href = 'login.html';
    } else {
        loadOrders();
    }
</script>
</body>
</html>
