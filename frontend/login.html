<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erp System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow p-4" style="width: 400px;">
            <h4 class="mb-4 text-center">PO Management Login</h4>
            <div id="error-msg" class="alert alert-danger d-none"></div>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" value="admin">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" value="admin123">
            </div>
            <button class="btn btn-primary w-100" onclick="login()">Login</button>
        </div>
    </div>
    
    <script>
    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
    
        const formData = new URLSearchParams();
        formData.append('username', username);
        formData.append('password', password);
    
        try {
            const res = await fetch('http://localhost:8000/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });
    
            if (!res.ok) throw new Error('Wrong credentials');
    
            const data = await res.json();
            localStorage.setItem('token', data.access_token);
            window.location.href = 'index.html';
        } catch (err) {
            const el = document.getElementById('error-msg');
            el.textContent = err.message;
            el.classList.remove('d-none');
        }
    }
    </script>
</body>
</html>
